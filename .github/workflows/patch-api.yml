name: Patch API
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the API file
        run: |
          f=$(grep -rl 'const TROLES' --include=*.js . | grep -v node_modules | head -1)
          if [ -z "$f" ]; then echo "Could not find the API file"; exit 1; fi
          if grep -q 'crPub' "$f"; then echo "Already patched"; exit 0; fi
          echo "Patching $f"
          python3 patch_api.py "$f"
      - name: Save the change
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add zine credits and operations/publication roles"
          git push
